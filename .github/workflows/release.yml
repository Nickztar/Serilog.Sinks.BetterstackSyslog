name: Release

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        if: github.repository_owner == 'nickztar'
        permissions:
            contents: read
            id-token: write # NuGet trusted publishing

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'
            - name: Install dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --configuration Release --no-restore
            - name: Set Version
              if: startsWith(github.ref, 'refs/tags')
              run: |
                  VERSION=`git describe --tags`
                  echo "Publishing Version: ${VERSION}"
                  echo "VERSION=${VERSION}" >> $GITHUB_ENV
            - name: Pack
              if: startsWith(github.ref, 'refs/tags')
              run: |
                  dotnet pack Serilog.Sinks.BetterstackSyslog/Serilog.Sinks.BetterstackSyslog.csproj /p:PackageVersion=$VERSION /p:Version=$VERSION -c Release -o ./publish
            - name: NuGet login
              if: startsWith(github.ref, 'refs/tags')
              uses: NuGet/login@v1
              id: login
              with:
                  user: Nickztar
            - name: Publish
              if: startsWith(github.ref, 'refs/tags')
              run: dotnet nuget push './publish/**/*.nupkg' -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
